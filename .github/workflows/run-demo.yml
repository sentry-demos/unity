name: Run Demo Builds

on:
  schedule:
    - cron: '*/50 * * * *' # every 50 minutes
  workflow_call:
    inputs:
      build-run-id:
        description: 'The run ID of the build workflow that created the artifacts'
        required: false
        type: string
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Sentaur Survivors"]
    types:
      - completed

jobs:
  get-build-run:
    name: Get Build Run
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.get-run.outputs.run-id }}

    steps:
      - name: Set run ID
        # Scheduled runs use the newest successful main build; callers use their own run.
        id: get-run
        shell: pwsh
        run: |
          if ("${{ inputs.build-run-id }}" -ne "") {
            "run-id=${{ inputs.build-run-id }}" >> $env:GITHUB_OUTPUT
          } else {
            $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
            "run-id=$($runs.workflow_runs[0].id)" >> $env:GITHUB_OUTPUT
          }

  run-windows:
    name: Run Windows Build
    needs: get-build-run
    runs-on: windows-latest

    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: SentaurSurvivors-StandaloneWindows64
          path: ./build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.get-build-run.outputs.run-id }}

      - name: Run Build
        timeout-minutes: 10
        env:
          SENTRY_DSN: ${{ secrets.TEST_DSN }}
        run: |
          $exePath = Get-ChildItem -Path "./build" -Filter "SentaurSurvivors-*.exe" -Recurse | Select-Object -First 1
          if ($exePath)
          {
            Write-Output "Found executable: $($exePath.FullName)"
            $startTime = Get-Date
            
            Start-Process -FilePath $exePath -ArgumentList "-demo" -Wait -PassThru -NoNewWindow
            
            $endTime = Get-Date
            $duration = $endTime - $startTime
            Write-Output "Game finished in $($duration.ToString('hh\:mm\:ss'))"
            
            $logPath = "$env:USERPROFILE\AppData\LocalLow\Sentry\SentaurSurvivors\Player.log"
            if (Test-Path $logPath)
            {
              Write-Output "::group::Game Logs"
              Get-Content $logPath
              Write-Output "::endgroup::"
            }
            else 
            {
              Write-Output "Unity log file not found at: $logPath"
            }
            
            Write-Output "Run executed successfully"
          } 
          else
          {
            Write-Error "No SentaurSurvivors executable found in build artifacts"
            exit 1
          }

  run-linux:
    name: Run Linux Build
    needs: get-build-run
    runs-on: ubuntu-latest

    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: SentaurSurvivors-StandaloneLinux64
          path: ./build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.get-build-run.outputs.run-id }}

      - name: Run Build
        timeout-minutes: 10
        env:
          SENTRY_DSN: ${{ secrets.TEST_DSN }}
        run: |
          executable=./build/SentaurSurvivors-StandaloneLinux64
          if [ ! -f "$executable" ]; then
            printf 'Linux executable not found: %s\n' "$executable" >&2
            exit 1
          fi

          chmod +x "$executable"
          if timeout --signal=TERM --kill-after=30s 9m xvfb-run --auto-servernum "$executable" -demo; then
            game_exit_code=0
          else
            game_exit_code=$?
          fi

          if [ "$game_exit_code" -ne 0 ]; then
            printf '%s\n' 'Linux demo exited unsuccessfully.' >&2
          fi

          log_path="$HOME/.config/unity3d/Sentry/SentaurSurvivors/Player.log"
          if [ -f "$log_path" ]; then
            printf '%s\n' '::group::Game Logs'
            while IFS= read -r line; do
              printf '%s\n' "$line"
            done < "$log_path"
            printf '%s\n' '::endgroup::'
          else
            printf 'Unity log file not found at: %s\n' "$log_path"
            exit 1
          fi

          if ! grep -Fq 'Start Game' "$log_path"; then
            printf '%s\n' 'Linux demo did not reach gameplay.' >&2
            exit 1
          fi

          if ! grep -Fq 'Attempting save_score_to_disk' "$log_path"; then
            printf '%s\n' 'Linux demo did not reach the expected native crash.' >&2
            exit 1
          fi

          if [ "$game_exit_code" -eq 0 ]; then
            printf '%s\n' 'Linux demo exited without the expected native crash.' >&2
            exit 1
          fi

          if [ "$game_exit_code" -eq 124 ]; then
            printf '%s\n' 'Linux demo exceeded its nine-minute limit.' >&2
            exit 1
          fi

      - name: Upload Linux player log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-Linux-PlayerLog
          path: ~/.config/unity3d/Sentry/SentaurSurvivors/Player.log
          if-no-files-found: warn

  run-android:
    name: Run Android Build
    needs: get-build-run
    runs-on: ubuntu-24.04-arm
    env:
      ANDROID_SERIAL: localhost:5555

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out app-runner
        uses: actions/checkout@v4
        with:
          repository: getsentry/app-runner
          ref: 8be06e220d490e527b810f6d073872025bf491b3
          path: app-runner

      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: SentaurSurvivors-Android
          path: ./build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.get-build-run.outputs.run-id }}

      - name: Start Redroid container
        run: |
          sudo apt-get update
          sudo apt-get install -y adb aapt "linux-modules-extra-$(uname -r)"
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux || true
          docker run -d --rm --privileged --name redroid -p 5555:5555 redroid/redroid:13.0.0_64only-latest androidboot.redroid_gpu_mode=guest

      - name: Wait for Redroid
        run: |
          for attempt in $(seq 1 60); do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            printf 'Waiting for Redroid (%s/60)\n' "$attempt"
            sleep 5
          done

          adb devices -l
          docker logs redroid
          exit 1

      - name: Run Build
        timeout-minutes: 15
        env:
          SENTRY_DSN: ${{ secrets.TEST_DSN }}
        run: pwsh -File .github/scripts/run-demo-android.ps1 -ApkPath ./build/SentaurSurvivors-Android.apk -Dsn "$SENTRY_DSN"

      - name: Upload Android player log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-Android-PlayerLog
          path: android-player.log
          if-no-files-found: warn
