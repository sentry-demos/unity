name: Run Demo Builds

# Note: deliberately no 'workflow_run' trigger on the build workflow. ci.yml calls this
# workflow directly, and having both would run every demo twice for each build.
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_call:
    inputs:
      build-run-id:
        description: 'The run ID of the build workflow that created the artifacts'
        required: false
        type: string
  workflow_dispatch:

jobs:
  get-build-run:
    name: Get Build Run
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.get-run.outputs.run-id }}

    steps:
      - name: Set run ID
        # Scheduled runs resolve the newest live Windows artifact on main; callers use their own run.
        id: get-run
        shell: pwsh
        env:
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:BUILD_RUN_ID)) {
            "run-id=$env:BUILD_RUN_ID" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Deliberately keyed off the artifact, not the run conclusion: a build run is
          # marked failed when any platform fails, and the demo only needs the Windows
          # player. Asking for a green run made this fall back to a months-old build
          # whose artifact had a different internal layout.
          $artifact = 'SentaurSurvivors-StandaloneWindows64'
          $uri = 'https://api.github.com/repos/${{ github.repository }}/actions/artifacts' +
            "?name=$artifact&per_page=100"
          $found = Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }

          # Newest first, so the first live main artifact wins.
          $match = $found.artifacts |
            Where-Object { -not $_.expired -and $_.workflow_run.head_branch -eq 'main' } |
            Select-Object -First 1

          # Without this the run ID comes out empty and every download below fails with a
          # confusing "artifact not found" instead of naming the real problem.
          if (-not $match) {
            throw "No live '$artifact' artifact found on main to take the player from."
          }

          Write-Host "Using $artifact from run $($match.workflow_run.id) ($($match.created_at))."
          "run-id=$($match.workflow_run.id)" >> $env:GITHUB_OUTPUT

  run-windows:
    name: Run Windows Build
    needs: get-build-run
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up demo run
        uses: ./.github/actions/setup-demo-run
        with:
          artifact: SentaurSurvivors-StandaloneWindows64
          build-run-id: ${{ needs.get-build-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Build
        timeout-minutes: 10
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.DSN }}
        run: |
          $executable = './build/SentaurSurvivors.exe'
          if (-not (Test-Path $executable)) {
            throw "Windows executable not found: $executable"
          }

          ./.github/scripts/run-demo-desktop.ps1 -Platform Windows -ExecutablePath (Resolve-Path $executable).Path

      - name: Upload Windows player log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-Windows-PlayerLog
          path: desktop-player.log
          if-no-files-found: warn

  run-linux:
    name: Run Linux Build
    needs: get-build-run
    # Temporarily disabled: only the Windows demo runs for now.
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up demo run
        uses: ./.github/actions/setup-demo-run
        with:
          artifact: SentaurSurvivors-StandaloneLinux64
          build-run-id: ${{ needs.get-build-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Build
        timeout-minutes: 10
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.DSN }}
        run: |
          executable=./build/SentaurSurvivors
          if [ ! -f "$executable" ]; then
            printf 'Linux executable not found: %s\n' "$executable" >&2
            exit 1
          fi

          chmod +x "$executable"
          # The player needs a display server even though nothing watches it.
          xvfb-run pwsh -File .github/scripts/run-demo-desktop.ps1 -Platform Linux -ExecutablePath "$executable"

      - name: Upload Linux player log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-Linux-PlayerLog
          path: desktop-player.log
          if-no-files-found: warn

  run-macos:
    name: Run macOS Build
    needs: get-build-run
    # Temporarily disabled: only the Windows demo runs for now.
    if: false
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up demo run
        uses: ./.github/actions/setup-demo-run
        with:
          artifact: SentaurSurvivors-StandaloneOSX
          path: .
          build-run-id: ${{ needs.get-build-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Build
        shell: bash
        run: |
          mkdir -p build
          tar -xzf SentaurSurvivors-macOS.tar.gz -C build

      - name: Run Build
        timeout-minutes: 10
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.DSN }}
        run: |
          executable=./build/SentaurSurvivors.app/Contents/MacOS/SentaurSurvivors
          if [ ! -f "$executable" ]; then
            printf 'macOS executable not found: %s\n' "$executable" >&2
            exit 1
          fi

          pwsh -File .github/scripts/run-demo-desktop.ps1 -Platform macOS -ExecutablePath "$executable"

      - name: Upload macOS player log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-macOS-PlayerLog
          path: desktop-player.log
          if-no-files-found: warn

  run-ios:
    name: Run iOS Build
    needs: get-build-run
    # Temporarily disabled: only the Windows demo runs for now.
    if: false
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up demo run
        uses: ./.github/actions/setup-demo-run
        with:
          artifact: SentaurSurvivors-iOS
          path: .
          build-run-id: ${{ needs.get-build-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Build
        shell: bash
        run: |
          mkdir -p build
          tar -xzf SentaurSurvivors-iOS.tar.gz -C build

      - name: Run Build
        timeout-minutes: 15
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.DSN }}
        run: ./.github/scripts/run-demo-ios.ps1 -AppPath ./build/SentaurSurvivors.app -Dsn $env:SENTRY_DSN

      - name: Upload iOS player log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-iOS-PlayerLog
          path: ios-player.log
          if-no-files-found: warn

  run-android:
    name: Run Android Build
    needs: get-build-run
    # Temporarily disabled: only the Windows demo runs for now.
    if: false
    runs-on: ubuntu-24.04-arm
    env:
      ANDROID_SERIAL: localhost:5555

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up demo run
        uses: ./.github/actions/setup-demo-run
        with:
          artifact: SentaurSurvivors-Android
          build-run-id: ${{ needs.get-build-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Redroid runs a real Android userspace in a container, which needs the binder
      # kernel modules the stock runner image does not load.
      - name: Start Redroid container
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y adb aapt "linux-modules-extra-$(uname -r)"
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux || true
          docker run -d --rm --privileged --name redroid -p 5555:5555 \
            redroid/redroid:13.0.0_64only-latest androidboot.redroid_gpu_mode=guest

      - name: Wait for Redroid
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            printf 'Waiting for Redroid (%s/60)\n' "$attempt"
            sleep 5
          done

          adb devices -l
          docker logs redroid
          exit 1

      - name: Run Build
        timeout-minutes: 15
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.DSN }}
        run: ./.github/scripts/run-demo-android.ps1 -ApkPath ./build/SentaurSurvivors.apk -Dsn $env:SENTRY_DSN

      - name: Upload Android player log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-Android-PlayerLog
          path: android-player.log
          if-no-files-found: warn
