name: Run Demo Builds

on:
  schedule:
    - cron: '*/50 * * * *' # every 50 minutes
  workflow_call:
    inputs:
      build-run-id:
        description: 'The run ID of the build workflow that created the artifacts'
        required: false
        type: string
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Sentaur Survivors"]
    types:
      - completed

jobs:
  get-build-run:
    name: Get Build Run
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.get-run.outputs.run-id }}

    steps:
      - name: Set run ID
        # Scheduled runs use the newest successful main build; callers use their own run.
        id: get-run
        shell: pwsh
        run: |
          if ("${{ inputs.build-run-id }}" -ne "") {
            "run-id=${{ inputs.build-run-id }}" >> $env:GITHUB_OUTPUT
          } else {
            $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
            "run-id=$($runs.workflow_runs[0].id)" >> $env:GITHUB_OUTPUT
          }

  run-windows:
    name: Run Windows Build
    needs: get-build-run
    runs-on: windows-latest

    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: SentaurSurvivors-StandaloneWindows64
          path: ./build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.get-build-run.outputs.run-id }}

      - name: Run Build
        timeout-minutes: 10
        env:
          SENTRY_DSN: ${{ secrets.TEST_DSN }}
        run: |
          $exePath = Get-ChildItem -Path "./build" -Filter "SentaurSurvivors-*.exe" -Recurse | Select-Object -First 1
          if ($exePath)
          {
            Write-Output "Found executable: $($exePath.FullName)"
            $startTime = Get-Date
            
            Start-Process -FilePath $exePath -ArgumentList "-demo" -Wait -PassThru -NoNewWindow
            
            $endTime = Get-Date
            $duration = $endTime - $startTime
            Write-Output "Game finished in $($duration.ToString('hh\:mm\:ss'))"
            
            $logPath = "$env:USERPROFILE\AppData\LocalLow\Sentry\SentaurSurvivors\Player.log"
            if (Test-Path $logPath)
            {
              Write-Output "::group::Game Logs"
              Get-Content $logPath
              Write-Output "::endgroup::"
            }
            else 
            {
              Write-Output "Unity log file not found at: $logPath"
            }
            
            Write-Output "Run executed successfully"
          } 
          else
          {
            Write-Error "No SentaurSurvivors executable found in build artifacts"
            exit 1
          }

  run-linux:
    name: Run Linux Build
    needs: get-build-run
    runs-on: ubuntu-latest

    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: SentaurSurvivors-StandaloneLinux64
          path: ./build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.get-build-run.outputs.run-id }}

      - name: Run Build
        timeout-minutes: 10
        env:
          SENTRY_DSN: ${{ secrets.DSN }}
        run: |
          executable=./build/SentaurSurvivors-StandaloneLinux64
          if [ ! -f "$executable" ]; then
            printf 'Linux executable not found: %s\n' "$executable" >&2
            exit 1
          fi

          chmod +x "$executable"
          if ! xvfb-run --auto-servernum "$executable" -demo; then
            printf '%s\n' 'Linux demo exited unsuccessfully.' >&2
          fi

          log_path="$HOME/.config/unity3d/Sentry/SentaurSurvivors/Player.log"
          if [ -f "$log_path" ]; then
            printf '%s\n' '::group::Game Logs'
            while IFS= read -r line; do
              printf '%s\n' "$line"
            done < "$log_path"
            printf '%s\n' '::endgroup::'
          else
            printf 'Unity log file not found at: %s\n' "$log_path"
          fi

  run-android:
    name: Run Android Build
    needs: get-build-run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out app-runner
        uses: actions/checkout@v4
        with:
          repository: getsentry/app-runner
          ref: 8be06e220d490e527b810f6d073872025bf491b3
          path: app-runner

      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: SentaurSurvivors-Android
          path: ./build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.get-build-run.outputs.run-id }}

      - name: Enable KVM group permissions
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Add Android build-tools to PATH
        shell: pwsh
        run: |
          $buildToolsDirectory = (Get-ChildItem "$env:ANDROID_HOME/build-tools" -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1).FullName
          $buildToolsDirectory >> $env:GITHUB_PATH

      - name: Set up Android directories
        run: |
          mkdir -p "$HOME/.android/avd"
          touch "$HOME/.android/repositories.cfg"

      - name: Run Build
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        timeout-minutes: 15
        env:
          SENTRY_DSN: ${{ secrets.DSN }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          channel: stable
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          emulator-options: >
            -no-window
            -no-snapshot-save
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-metrics
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            pwsh -File .github/scripts/run-demo-android.ps1 -ApkPath ./build/SentaurSurvivors-Android.apk -Dsn "$SENTRY_DSN"
