name: Build Sentaur Survivors

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # e.g. to manually trigger on foreign PRs
  schedule:
    - cron: "0 0 * * 0"

# One floating license is shared across the whole org, so the build jobs below are
# chained rather than run in parallel and only one workflow run holds it at a time.
concurrency:
  group: unity-floating-license
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS and iOS
    runs-on: macos-15
    env:
      UNITY_NO_CONSENT_PROMPT: 1
      UNITY_NO_UPDATE_CHECK: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: ./.github/actions/cache-unity-library
        with:
          target: StandaloneOSX

      - name: Set up Unity
        uses: ./.github/actions/setup-unity
        with:
          modules: mac-il2cpp ios
          license-server-url: ${{ secrets.LICENSE_SERVER_URL }}

      - name: Build macOS player
        uses: ./.github/actions/build-player
        with:
          target: StandaloneOSX
          output-path: Build/StandaloneOSX/SentaurSurvivors.app
          sentry-dsn: ${{ secrets.TEST_DSN }}
          sentry-auth-token: ${{ secrets.TEST_AUTH_TOKEN }}
          sentry-org: ${{ secrets.TEST_ORG }}
          sentry-project: ${{ secrets.TEST_PROJECT }}

      # Tar the bundle: upload-artifact drops the executable bit and flattens the
      # symlinks that the .app relies on to launch.
      - name: Create macOS archive
        shell: bash
        run: tar -czf SentaurSurvivors-macOS.tar.gz -C Build/StandaloneOSX SentaurSurvivors.app

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-StandaloneOSX
          path: SentaurSurvivors-macOS.tar.gz
          retention-days: 90

      - name: Build iOS Xcode project
        uses: ./.github/actions/build-player
        with:
          target: iOS
          output-path: Build/iOS
          sentry-dsn: ${{ secrets.TEST_DSN }}
          sentry-auth-token: ${{ secrets.TEST_AUTH_TOKEN }}
          sentry-org: ${{ secrets.TEST_ORG }}
          sentry-project: ${{ secrets.TEST_PROJECT }}

      # Compiling no longer needs the editor, but the license is returned in a later
      # step so a failure here still releases it.
      - name: Compile iOS Xcode project
        shell: pwsh
        run: ./.github/scripts/compile-xcode-project.ps1 -ProjectPath Build/iOS

      - name: Return Unity floating license
        if: always()
        uses: ./.github/actions/return-unity-license

      - name: Create iOS archive
        shell: bash
        run: |
          tar -czf SentaurSurvivors-iOS.tar.gz \
            -C Build/iOS/archive/Unity-iPhone/Build/Products/Release-iphonesimulator SentaurSurvivors.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-iOS
          path: SentaurSurvivors-iOS.tar.gz
          retention-days: 90

      # Only cache a Library that produced a working build. Saving after a failure
      # would persist a half-imported Library for every later run to inherit.
      - name: Save Unity Library
        uses: ./.github/actions/cache-unity-library
        with:
          target: StandaloneOSX
          save: true

  build-windows:
    name: Build Windows
    needs: build-macos
    # Not always(): that would keep the chain going after the run is cancelled.
    # !cancelled() still runs this when the previous build failed.
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    env:
      UNITY_NO_CONSENT_PROMPT: 1
      UNITY_NO_UPDATE_CHECK: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: ./.github/actions/cache-unity-library
        with:
          target: StandaloneWindows64

      - name: Set up Unity
        uses: ./.github/actions/setup-unity
        with:
          modules: windows-il2cpp
          license-server-url: ${{ secrets.LICENSE_SERVER_URL }}

      - name: Build Windows player
        uses: ./.github/actions/build-player
        with:
          target: StandaloneWindows64
          output-path: Build/StandaloneWindows64/SentaurSurvivors.exe
          sentry-dsn: ${{ secrets.TEST_DSN }}
          sentry-auth-token: ${{ secrets.TEST_AUTH_TOKEN }}
          sentry-org: ${{ secrets.TEST_ORG }}
          sentry-project: ${{ secrets.TEST_PROJECT }}

      - name: Return Unity floating license
        if: always()
        uses: ./.github/actions/return-unity-license

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-StandaloneWindows64
          path: Build/StandaloneWindows64
          retention-days: 90

      - name: Save Unity Library
        uses: ./.github/actions/cache-unity-library
        with:
          target: StandaloneWindows64
          save: true

  build-linux:
    name: Build Linux and Android
    needs: build-windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      UNITY_NO_CONSENT_PROMPT: 1
      UNITY_NO_UPDATE_CHECK: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: ./.github/actions/cache-unity-library
        with:
          target: StandaloneLinux64

      - name: Set up Unity
        uses: ./.github/actions/setup-unity
        with:
          modules: linux-il2cpp android
          license-server-url: ${{ secrets.LICENSE_SERVER_URL }}

      - name: Build Linux player
        uses: ./.github/actions/build-player
        with:
          target: StandaloneLinux64
          output-path: Build/StandaloneLinux64/SentaurSurvivors
          sentry-dsn: ${{ secrets.TEST_DSN }}
          sentry-auth-token: ${{ secrets.TEST_AUTH_TOKEN }}
          sentry-org: ${{ secrets.TEST_ORG }}
          sentry-project: ${{ secrets.TEST_PROJECT }}

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-StandaloneLinux64
          path: Build/StandaloneLinux64
          retention-days: 90

      - name: Build Android player
        uses: ./.github/actions/build-player
        with:
          target: Android
          output-path: Build/Android/SentaurSurvivors.apk
          sentry-dsn: ${{ secrets.TEST_DSN }}
          sentry-auth-token: ${{ secrets.TEST_AUTH_TOKEN }}
          sentry-org: ${{ secrets.TEST_ORG }}
          sentry-project: ${{ secrets.TEST_PROJECT }}

      - name: Return Unity floating license
        if: always()
        uses: ./.github/actions/return-unity-license

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentaurSurvivors-Android
          path: Build/Android
          retention-days: 90

      - name: Save Unity Library
        uses: ./.github/actions/cache-unity-library
        with:
          target: StandaloneLinux64
          save: true

  run-demo:
    name: Run Demo
    needs: [build-windows, build-linux, build-macos]
    uses: ./.github/workflows/run-demo.yml
    secrets: inherit
    with:
      build-run-id: ${{ github.run_id }}
