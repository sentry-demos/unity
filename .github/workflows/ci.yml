name: Build Sentaur Survivors

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # e.g. to manually trigger on foreign PRs
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight to ensure artifacts don't expire

# The floating license has one seat shared by all workflow runs; keep only latest run.
concurrency:
  group: unity-floating-license
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows
    runs-on: windows-2022
    env:
      UNITY_CLI_VERSION: 1.0.0-beta.3
      UNITY_NO_CONSENT_PROMPT: 1
      UNITY_NO_UPDATE_CHECK: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set Unity Version
        shell: pwsh
        run: |
          $version = (Get-Content ProjectSettings/ProjectVersion.txt | Where-Object { $_ -match '^m_EditorVersion:' }).Split(':')[1].Trim()
          "UNITY_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore Windows Build Cache
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: build
          key: Build-v1-${{ runner.os }}-StandaloneWindows64-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}

      - name: Install Unity CLI
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Invoke-RestMethod https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.ps1
          & ([scriptblock]::Create($installer)) -Target "$env:UNITY_CLI_VERSION" -Channel beta
          "$env:LOCALAPPDATA\Unity\bin" >> $env:GITHUB_PATH

      - name: Verify Unity CLI
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = (unity --version).Trim()
          if ($version -ne $env:UNITY_CLI_VERSION) {
            throw "Expected Unity CLI $env:UNITY_CLI_VERSION, found $version."
          }

      - name: Set Unity Editor install path
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $editorPath = Join-Path $env:RUNNER_TEMP 'unity-editors'
          New-Item -ItemType Directory -Path $editorPath -Force | Out-Null
          "UNITY_EDITOR_PATH=$editorPath" >> $env:GITHUB_ENV
          unity install-path --set "$editorPath" --non-interactive

      - name: Install Unity Editor
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: unity install "$env:UNITY_VERSION" --module windows-il2cpp --childModules --accept-eula --yes --non-interactive

      - name: Cache Unity Library
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-v2-${{ runner.os }}-StandaloneWindows64-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Configure Unity license server
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENSE_SERVER_URL)) {
            throw 'LICENSE_SERVER_URL is required for Unity floating licenses.'
          }

          $configDirectory = Join-Path $env:ProgramData 'Unity/config'
          New-Item -ItemType Directory -Path $configDirectory -Force | Out-Null
          @{
            licensingServiceBaseUrl = $env:LICENSE_SERVER_URL
            enableEntitlementLicensing = $true
            enableFloatingApi = $true
            clientConnectTimeoutSec = 5
            clientHandshakeTimeoutSec = 10
          } | ConvertTo-Json | Set-Content -Path (Join-Path $configDirectory 'services-config.json')

      - name: Acquire Unity floating license
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          unity license server status --format json
          unity license activate --floating --non-interactive

      - name: Build Windows player
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.TEST_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.TEST_ORG }}
          SENTRY_PROJECT: ${{ secrets.TEST_PROJECT }}
          SENTRY_LOG_LEVEL: debug
        run: |
          unity build . `
            --target StandaloneWindows64 `
            --execute-method Editor.GameBuilder.Build `
            --output-path build/StandaloneWindows64/SentaurSurvivors-StandaloneWindows64.exe `
            --editor-version "$env:UNITY_VERSION" `
            --non-interactive

      - name: Save Windows Build Cache
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      - name: Return Unity floating license
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (Get-Command unity -ErrorAction SilentlyContinue) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              unity license return --yes --non-interactive
              if ($LASTEXITCODE -eq 0) {
                break
              }

              if ($attempt -eq 3) {
                throw "Failed to return Unity floating license after $attempt attempts."
              }

              Start-Sleep -Seconds 5
            }
          }

          $configPath = Join-Path $env:ProgramData 'Unity/config/services-config.json'
          Remove-Item -Path $configPath -Force -ErrorAction SilentlyContinue

      - name: Upload Windows Unity Build Logs
        uses: actions/upload-artifact@v4
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        with:
          name: SentaurSurvivors-Windows-UnityLogs
          path: Logs
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SentaurSurvivors-StandaloneWindows64
          path: build
          retention-days: 90

  build-linux:
    name: Build Linux and Android
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    env:
      UNITY_CLI_VERSION: 1.0.0-beta.3
      UNITY_NO_CONSENT_PROMPT: 1
      UNITY_NO_UPDATE_CHECK: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set Unity Version
        shell: bash
        run: |
          unity_version=$(awk '/^m_EditorVersion:/{print $2}' ProjectSettings/ProjectVersion.txt)
          printf 'UNITY_VERSION=%s\n' "$unity_version" >> "$GITHUB_ENV"

      - name: Restore Linux and Android Build Cache
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: build
          key: Build-v1-${{ runner.os }}-StandaloneLinux64-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}

      - name: Install Unity CLI
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        env:
          UNITY_CLI_CHANNEL: beta
        run: curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | bash

      - name: Add Unity CLI to PATH
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Unity CLI
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          version=$(unity --version)
          if [ "$version" != "$UNITY_CLI_VERSION" ]; then
            printf 'Expected Unity CLI %s, found %s.\n' "$UNITY_CLI_VERSION" "$version" >&2
            exit 1
          fi

      - name: Set Unity Editor install path
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          editor_path="$RUNNER_TEMP/unity-editors"
          mkdir -p "$editor_path"
          printf 'UNITY_EDITOR_PATH=%s\n' "$editor_path" >> "$GITHUB_ENV"
          unity install-path --set "$editor_path" --non-interactive

      - name: Install Unity Editor
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: unity install "$UNITY_VERSION" --module linux-il2cpp --module android --childModules --accept-eula --yes --non-interactive

      - name: Cache Unity Library
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneLinux64-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Configure Unity license server
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        env:
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
        run: |
          if [ -z "$LICENSE_SERVER_URL" ]; then
            printf '%s\n' 'LICENSE_SERVER_URL is required for Unity floating licenses.' >&2
            exit 1
          fi

          sudo install -d /usr/share/unity3d/config
          jq -n --arg licensing_service_base_url "$LICENSE_SERVER_URL" '{
            licensingServiceBaseUrl: $licensing_service_base_url,
            enableEntitlementLicensing: true,
            enableFloatingApi: true,
            clientConnectTimeoutSec: 5,
            clientHandshakeTimeoutSec: 10
          }' | sudo tee /usr/share/unity3d/config/services-config.json > /dev/null

      - name: Acquire Unity floating license
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          unity license server status --format json || true
          unity license activate --floating --format json --non-interactive

      - name: Build Linux player
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.TEST_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.TEST_ORG }}
          SENTRY_PROJECT: ${{ secrets.TEST_PROJECT }}
          SENTRY_LOG_LEVEL: debug
        run: |
          unity build . \
            --target StandaloneLinux64 \
            --execute-method Editor.GameBuilder.Build \
            --output-path build/StandaloneLinux64/SentaurSurvivors-StandaloneLinux64 \
            --editor-version "$UNITY_VERSION" \
            --no-tail \
            --non-interactive

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SentaurSurvivors-StandaloneLinux64
          path: build/StandaloneLinux64
          retention-days: 90

      - name: Build Android player
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.TEST_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.TEST_ORG }}
          SENTRY_PROJECT: ${{ secrets.TEST_PROJECT }}
          SENTRY_LOG_LEVEL: debug
        run: |
          unity build . \
            --target Android \
            --execute-method Editor.GameBuilder.Build \
            --output-path build/Android/SentaurSurvivors-Android.apk \
            --editor-version "$UNITY_VERSION" \
            --no-tail \
            --non-interactive

      - name: Save Linux and Android Build Cache
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SentaurSurvivors-Android
          path: build/Android
          retention-days: 90

      - name: Return Unity floating license
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if command -v unity > /dev/null; then
            for attempt in 1 2 3; do
              if unity license return --yes --non-interactive; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                printf '%s\n' "Failed to return Unity floating license after $attempt attempts." >&2
                exit 1
              fi

              sleep 5
            done
          fi

          sudo rm -f /usr/share/unity3d/config/services-config.json

      - name: Upload Linux Unity Build Logs
        uses: actions/upload-artifact@v4
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        with:
          name: SentaurSurvivors-Linux-UnityLogs
          path: Logs
          retention-days: 90
          if-no-files-found: warn

  run-demo:
    name: Run Demo
    needs: [build, build-linux]
    uses: ./.github/workflows/run-demo.yml
    secrets: inherit
    with:
      build-run-id: ${{ github.run_id }}
