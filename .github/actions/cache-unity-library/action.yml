name: Cache Unity Library
description: >-
  Restores the Unity Library folder for a build target. Call with 'save: true' in a
  later step to persist it. The key is content-addressed on the package lock and the
  Editor version, so bumping either produces a fresh import instead of reusing a
  Library that no longer matches the project.

inputs:
  target:
    description: Unity build target the Library belongs to, e.g. StandaloneOSX.
    required: true
  save:
    description: Set to 'true' to save the cache instead of restoring it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Restore Library
      if: inputs.save != 'true'
      uses: actions/cache/restore@v4
      with:
        path: Library
        key: Library-${{ inputs.target }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
        # A Library from a different package set still imports faster than a cold one.
        restore-keys: Library-${{ inputs.target }}-

    - name: Save Library
      if: inputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: Library
        key: Library-${{ inputs.target }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
