name: Return Unity license
description: >-
  Returns the Unity floating license and removes the licensing config. Always run
  this with 'if: always()' - a license that is not returned stays checked out until
  the server times it out, blocking every other build in the queue.

runs:
  using: composite
  steps:
    - name: Return Unity floating license
      shell: pwsh
      run: |
        # The CLI may be missing if setup-unity failed before installing it. That is
        # not an error here: there is no license to return in that case.
        if (Get-Command unity -ErrorAction SilentlyContinue) {
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            unity license return --yes --non-interactive
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -eq 3) {
              throw "Failed to return Unity floating license after $attempt attempts."
            }

            Start-Sleep -Seconds 5
          }
        }

        $configPath = if ($IsWindows) {
          Join-Path $env:ProgramData 'Unity/config/services-config.json'
        } elseif ($IsMacOS) {
          '/Library/Application Support/Unity/config/services-config.json'
        } else {
          '/usr/share/unity3d/config/services-config.json'
        }

        if ($IsWindows) {
          Remove-Item -Path $configPath -Force -ErrorAction SilentlyContinue
        } else {
          sudo rm -f $configPath
        }
